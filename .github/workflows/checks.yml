name: Checks

# Package build, lintian, lint and (where available) unit tests on every pull
# request. The jobs are shared with the other linuxmuster repositories, see
# .github/workflows/lmn-checks.yml in edulution-io/edulution-package-server.

on:
  pull_request:
  push:
    branches: [lmn74]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: edulution-io/edulution-package-server/.github/workflows/lmn-checks.yml@main
    with:
      build-runner: ubuntu-24.04
      build-setup: sudo apt-get update && sudo apt-get install -y debhelper build-essential
      build-command: make deb
      # Runtime dependencies come from package.edulution.io, so the tests run
      # against the same packages as a server.
      test-packages: >-
        sophomorix-samba linuxmuster-common python3-yaml python3-ldap python3-ldap3 python3-magic python3-configobj python3-jinja2 python3-pexpect python3-cryptography samba-common-bin smbclient python3-smbc
      test-command: cd usr/lib/python3/dist-packages && python3 -m pytest -q -p no:cacheprovider --cov=linuxmusterTools linuxmusterTools
